name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + pre-commit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit ruff

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('frappe-bench/apps/myschools/.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          cd frappe-bench/apps/myschools
          pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Frappe + pytest)
    runs-on: ubuntu-22.04
    needs: lint
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: myschools-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OS deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wkhtmltopdf libmariadb-dev

      - name: Configure MariaDB for Frappe
        run: |
          mysql -uroot -ptravis -h127.0.0.1 -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql -uroot -ptravis -h127.0.0.1 -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install frappe-bench CLI
        run: pip install frappe-bench

      - name: Initialise bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 --python "$(which python3.12)" frappe-bench
          cd frappe-bench
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
          bench get-app erpnext --branch version-15
          bench get-app education --branch version-15.2
          # symlink our app from the checked-out repo, register it as an
          # editable Python package in bench's venv, and list it in apps.txt
          # so `bench install-app myschools` can find it (mirrors what
          # `bench get-app` would do for a fresh clone).
          ln -s "${{ github.workspace }}/myschools-repo/frappe-bench/apps/myschools" apps/myschools
          ./env/bin/pip install -e apps/myschools
          # bench init's sites/apps.txt has no trailing newline, so a plain
          # `echo myschools >> apps.txt` would glue `education` + `myschools`
          # into `educationmyschools`. Ensure the file ends with a newline
          # before appending.
          [ -z "$(tail -c 1 sites/apps.txt)" ] || echo "" >> sites/apps.txt
          echo "myschools" >> sites/apps.txt

      - name: Create test site + install apps
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --mariadb-root-password travis \
            --admin-password admin \
            --no-mariadb-socket \
            --db-host 127.0.0.1 \
            --install-app erpnext --install-app education
          bench --site test_site install-app myschools
          bench --site test_site set-config developer_mode 1

      - name: Install coverage (for --coverage flag)
        working-directory: frappe-bench
        run: ./env/bin/pip install coverage

      - name: Bootstrap test site (mimic ERPNext setup wizard slice)
        working-directory: frappe-bench
        run: bench --site test_site execute myschools.scripts.ci_bootstrap.run

      - name: Run Frappe test suite
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app myschools --coverage

      - name: Enforce coverage floor (ratchet)
        working-directory: frappe-bench
        run: ./env/bin/python apps/myschools/myschools/scripts/check_coverage_floor.py

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-22.04
    needs: lint
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: myschools-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OS deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wkhtmltopdf libmariadb-dev

      - name: Configure MariaDB for Frappe
        run: |
          mysql -uroot -ptravis -h127.0.0.1 -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql -uroot -ptravis -h127.0.0.1 -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install frappe-bench CLI
        run: pip install frappe-bench

      - name: Initialise bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 --python "$(which python3.12)" frappe-bench
          cd frappe-bench
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
          bench get-app erpnext --branch version-15
          bench get-app education --branch version-15.2
          ln -s "${{ github.workspace }}/myschools-repo/frappe-bench/apps/myschools" apps/myschools
          ./env/bin/pip install -e apps/myschools
          [ -z "$(tail -c 1 sites/apps.txt)" ] || echo "" >> sites/apps.txt
          echo "myschools" >> sites/apps.txt

      - name: Create test site + install apps
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --mariadb-root-password travis \
            --admin-password admin \
            --no-mariadb-socket \
            --db-host 127.0.0.1 \
            --install-app erpnext --install-app education
          bench --site test_site install-app myschools
          bench --site test_site set-config developer_mode 1
          bench use test_site

      - name: Bootstrap test site (mimic ERPNext setup wizard slice)
        working-directory: frappe-bench
        run: bench --site test_site execute myschools.scripts.ci_bootstrap.run

      - name: Build frontend assets (needed for the desk shell to bootstrap)
        working-directory: frappe-bench
        run: |
          # `bench init` builds frappe + erpnext bundles, but does not pick up
          # apps added after init (myschools was symlinked post-init). The
          # desk shell (.navbar, .form-page) is rendered by frappe's bundle
          # and won't appear in Playwright if those bundles are missing.
          bench build --app myschools

      - name: Seed deterministic e2e data
        working-directory: frappe-bench
        # seed_e2e self-bootstraps: if no Branch exists it chains seed_demo;
        # if no submitted Invoice exists it chains seed_education +
        # demo_royalty_invoice. Idempotent — re-running it is a no-op.
        run: bench --site test_site execute myschools.scripts.seed_e2e.main

      - name: Seed role test users (for HTTP battery + branch desk matrix)
        working-directory: frappe-bench
        # Creates one System User per franchise role (password: admin) plus
        # backing Employee rows, which verify_http_battery and
        # verify_branch_desk_cards log in as. Idempotent.
        run: bench --site test_site execute myschools.scripts.seed_test_users.run

      - name: Verify branch desk number cards (role × surface matrix)
        working-directory: frappe-bench
        # bench-execute check (no HTTP): asserts every branch role sees its
        # number cards. Fails the job via frappe.throw on any missing card.
        run: bench --site test_site execute myschools.scripts.verify_branch_desk_cards.run

      - name: Make test_site resolve to loopback
        run: |
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Start Frappe web server (background)
        working-directory: frappe-bench
        run: |
          # bench serve binds the configured default site (set via `bench use`).
          # Run it in the background and tail its log to a file so we can
          # surface errors if the e2e step fails.
          nohup bench serve --port 8000 > /tmp/bench-serve.log 2>&1 &
          # Wait for the server to accept connections (max 60s).
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://test_site:8000/api/method/ping"; then
              echo "bench up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "bench failed to start within 60s — log follows:"
          cat /tmp/bench-serve.log
          exit 1

      - name: Run HTTP verification battery
        working-directory: frappe-bench
        # Live HTTP smoke against the running server as every franchise role
        # (desk landing, branch portal, inspection portal, guest admission
        # POST). Exits non-zero on any failure. host=test_site matches the
        # default site bench serve is binding.
        run: ./env/bin/python -c "from myschools.scripts.verify_http_battery import run; run(host='test_site')"

      - name: Install Playwright deps
        working-directory: frappe-bench/apps/myschools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify seed state file exists
        run: |
          # seed_e2e.py wrote /tmp/mys_e2e_state.json earlier in this job.
          ls -l /tmp/mys_e2e_state.json
          cat /tmp/mys_e2e_state.json

      - name: Run Playwright tests
        working-directory: frappe-bench/apps/myschools
        env:
          MYS_BASE_URL: http://test_site:8000
          CI: "1"
        run: npx playwright test --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frappe-bench/apps/myschools/playwright-report/
            frappe-bench/apps/myschools/test-results/
            /tmp/bench-serve.log
          retention-days: 7
