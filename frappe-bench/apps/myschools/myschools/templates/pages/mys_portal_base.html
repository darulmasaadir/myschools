{% extends "templates/web.html" %}

{% block head_include %}
{{ super() }}
<style>
	.mys-portal {
		max-width: 42rem;
		margin: 0 auto;
		padding: 1.25rem 1rem 2.5rem;
		color: var(--mys-text, #1a1a1a);
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	.mys-portal__brand {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		margin-bottom: 1.5rem;
		padding-bottom: 0.75rem;
		border-bottom: 1px solid var(--mys-primary-light, #c8e6d5);
	}
	.mys-portal__brand img {
		height: 28px;
		width: auto;
	}
	.mys-portal__brand span {
		font-weight: 600;
		color: var(--mys-primary-dark, #0a5a36);
	}
	.mys-portal h1 {
		font-size: 1.35rem;
		margin: 0 0 0.5rem;
		color: var(--mys-primary-dark, #0a5a36);
	}
	.mys-portal p {
		color: var(--mys-text-muted, #6b7280);
		line-height: 1.5;
	}
	.mys-portal__card {
		background: #fff;
		border: 1px solid var(--mys-primary-light, #c8e6d5);
		border-radius: 8px;
		padding: 1rem 1.1rem;
		margin-top: 1rem;
	}
	.mys-portal__muted {
		color: var(--mys-text-muted, #6b7280);
		margin-bottom: 0.75rem;
	}
	.mys-portal__nav {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		margin-bottom: 1rem;
	}
	.mys-portal__nav-link {
		padding: 0.35rem 0.75rem;
		border-radius: 999px;
		border: 1px solid var(--mys-primary-light, #c8e6d5);
		color: var(--mys-primary-dark, #0a5a36);
		text-decoration: none;
		font-size: 0.9rem;
	}
	.mys-portal__nav-link.is-active {
		background: var(--mys-primary, #0f7a4a);
		color: #fff;
		border-color: var(--mys-primary, #0f7a4a);
	}
	.mys-portal__table {
		width: 100%;
		border-collapse: collapse;
		font-size: 0.9rem;
	}
	.mys-portal__table th,
	.mys-portal__table td {
		padding: 0.5rem 0.4rem;
		border-bottom: 1px solid #e5e7eb;
		text-align: left;
	}
	.mys-portal__table th {
		color: var(--mys-primary-dark, #0a5a36);
		font-weight: 600;
	}
	.mys-portal__dl {
		display: grid;
		grid-template-columns: 8rem 1fr;
		gap: 0.35rem 0.75rem;
		margin: 0;
	}
	.mys-portal__dl dt {
		font-weight: 600;
		color: var(--mys-text-muted, #6b7280);
	}
	.mys-portal__dl dd {
		margin: 0;
	}
	.mys-portal__summary {
		display: flex;
		flex-wrap: wrap;
		gap: 1rem;
		font-size: 0.9rem;
	}
	.mys-portal__actions {
		margin-top: 1rem;
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
	}
	.mys-portal__btn {
		display: inline-block;
		padding: 0.4rem 0.85rem;
		border-radius: 6px;
		background: var(--mys-primary, #0f7a4a);
		color: #fff;
		text-decoration: none;
		font-size: 0.9rem;
	}
</style>
{% endblock %}

{% block page_content %}
<div class="mys-portal">
	<header class="mys-portal__brand">
		<img src="/assets/myschools/images/mys-logo.svg" alt="MY School">
		<span>MY School</span>
	</header>
	{% block portal_content %}{% endblock %}
</div>
{% endblock %}
