{% extends "templates/web.html" %}

{% block head_include %}
{{ super() }}
<style>
	.mys-portal {
		max-width: 42rem;
		margin: 0 auto;
		padding: 1.25rem 1rem 2.5rem;
		color: var(--mys-text, #1a1a1a);
		font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	.mys-portal__brand {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		margin-bottom: 1.5rem;
		padding-bottom: 0.75rem;
		border-bottom: 1px solid var(--mys-primary-light, #c8e6d5);
	}
	.mys-portal__brand img {
		height: 28px;
		width: auto;
	}
	.mys-portal__brand span {
		font-weight: 600;
		color: var(--mys-primary-dark, #0a5a36);
	}
	.mys-portal h1 {
		font-size: 1.35rem;
		margin: 0 0 0.5rem;
		color: var(--mys-primary-dark, #0a5a36);
	}
	.mys-portal p {
		color: var(--mys-text-muted, #6b7280);
		line-height: 1.5;
	}
	.mys-portal__card {
		background: #fff;
		border: 1px solid var(--mys-primary-light, #c8e6d5);
		border-radius: 8px;
		padding: 1rem 1.1rem;
		margin-top: 1rem;
	}
</style>
{% endblock %}

{% block page_content %}
<div class="mys-portal">
	<header class="mys-portal__brand">
		<img src="/assets/myschools/images/mys-logo.svg" alt="MY School">
		<span>MY School</span>
	</header>
	{% block portal_content %}{% endblock %}
</div>
{% endblock %}
