{% extends "templates/pages/mys_portal_base.html" %}

{% block portal_content %}
<nav class="mys-portal__nav">
	{% for item in nav_items %}
	<a href="{{ item.route }}" class="mys-portal__nav-link{% if item.route == '/inspection/visits' %} is-active{% endif %}">{{ item.label }}</a>
	{% endfor %}
</nav>
<h1>{{ portal_title }}</h1>
<p id="form-error" class="mys-portal__error" style="display:none;"></p>
<form id="new-visit-form" class="mys-portal__card" onsubmit="return false;">
	<div class="mys-portal__field">
		<label for="branch">Branch</label>
		<select name="branch" id="branch" required>
			<option value="">Select branch</option>
			{% for b in branches %}
			<option value="{{ b.name }}">{{ b.branch_name }} ({{ b.branch_code }})</option>
			{% endfor %}
		</select>
	</div>
	<div class="mys-portal__field">
		<label for="visit_type">Visit type</label>
		<select name="visit_type" id="visit_type" required>
			{% for vt in visit_types %}
			<option value="{{ vt }}">{{ vt }}</option>
			{% endfor %}
		</select>
	</div>
	<div class="mys-portal__field">
		<label for="visit_date">Visit date</label>
		<input type="date" name="visit_date" id="visit_date" value="{{ frappe.utils.today() }}">
	</div>
	<div class="mys-portal__field">
		<label for="campus">Campus (optional)</label>
		<input type="text" name="campus" id="campus" placeholder="Campus name if scoped to one wing">
	</div>
	<button type="submit" id="create-visit-btn" class="mys-portal__btn">Create draft visit</button>
</form>

<script>
(function () {
	const form = document.getElementById("new-visit-form");
	const btn = document.getElementById("create-visit-btn");
	const err = document.getElementById("form-error");
	btn.addEventListener("click", async () => {
		err.style.display = "none";
		err.textContent = "";
		const branch = document.getElementById("branch").value;
		const visit_type = document.getElementById("visit_type").value;
		const visit_date = document.getElementById("visit_date").value;
		const campus = document.getElementById("campus").value;
		if (!branch || !visit_type) {
			err.textContent = "Branch and visit type are required.";
			err.style.display = "block";
			return;
		}
		btn.disabled = true;
		btn.textContent = "Creating…";
		try {
			const r = await fetch("/api/method/myschools.api.inspection_portal.create_visit", {
				method: "POST",
				headers: {
					"Content-Type": "application/x-www-form-urlencoded",
					"X-Frappe-CSRF-Token": (window.frappe && frappe.csrf_token) || window.csrf_token || "",
				},
				body: new URLSearchParams({ branch, visit_type, visit_date, campus }),
			});
			const data = await r.json();
			if (!r.ok || data.exc) {
				let msg = "Could not create visit.";
				try {
					const sm = JSON.parse(data._server_messages || "[]")[0];
					if (sm) msg = JSON.parse(sm).message || msg;
				} catch (_) { /* ignore */ }
				err.textContent = msg;
				err.style.display = "block";
				btn.disabled = false;
				btn.textContent = "Create draft visit";
				return;
			}
			const name = data.message && data.message.name;
			window.location.href = "/inspection/visit?name=" + encodeURIComponent(name);
		} catch (e) {
			err.textContent = "Network error: " + e.message;
			err.style.display = "block";
			btn.disabled = false;
			btn.textContent = "Create draft visit";
		}
	});
})();
</script>
{% endblock %}
